name: Build CPVP Optimizer 1.21.11

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Single Universal JAR (Client + Server)
        run: gradle remapJar --no-daemon --stacktrace

      - name: Upload CPVP-Optimizer-1.21.11.jar
        uses: actions/upload-artifact@v4
        with:
          name: CPVP-Optimizer-1.21.11
          path: build/libs/CPVP-Optimizer-1.21.11.jar
          if-no-files-found: error
